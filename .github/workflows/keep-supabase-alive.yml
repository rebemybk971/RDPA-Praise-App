name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          echo "Ping Supabase pour eviter la mise en pause..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/chants?select=id&limit=1")
          echo "Code HTTP recu : $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "Ping reussi - Supabase repond correctement"
            exit 0
          else
            echo "Ping echoue - Code HTTP : $RESPONSE"
            exit 1
          fi
